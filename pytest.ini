[pytest]
# Pytest Configuration for Evently

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 8.0

# Add current directory to Python path
pythonpath = .

# Console output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --asyncio-mode=auto
    --maxfail=5

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, database required)
    e2e: End-to-end tests (slow, full stack required)
    security: Security tests
    performance: Performance tests (slow)
    slow: Slow running tests
    smoke: Smoke tests for quick validation
    regression: Regression tests
    api: API endpoint tests
    database: Database tests
    auth: Authentication tests
    events: Event management tests
    bookings: Booking tests
    notifications: Notification tests

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests
timeout = 300
timeout_method = thread

# Parallel execution
[pytest-xdist]
looponfail = True

# HTML report
[html]
report_title = Evently Test Report
